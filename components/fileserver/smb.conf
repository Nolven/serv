# samba: one SMB3 share of the file store, reached over WireGuard only (the
# firewall drops 445 everywhere else). Only rendered when
# fileserver.samba.enable is true; the share section itself is appended by
# the renderer from config.yaml.
[global]
   server role = standalone server
   workgroup = WORKGROUP
   # SMB1/SMB2 have known weaknesses, and Windows 10+, Linux cifs and the
   # Android SMB clients all speak SMB3
   server min protocol = SMB3
   # no NetBIOS / network browsing - clients connect to an explicit address
   disable netbios = yes
   smb ports = 445
   map to guest = never
   restrict anonymous = 2
   usershare allow guests = no
   passdb backend = tdbsam
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000
