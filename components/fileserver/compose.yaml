# sftpgo: web UI for the file store plus expiring share/upload links. Only
# rendered when fileserver.sftpgo.enable is true.
#
# user, the web UI's port, the file store's bind mount and the provisioning
# file are filled in by the renderer from config.yaml.
services:
  sftpgo:
    container_name: sftpgo
    # >= 2.7.3: fixes CVE-2026-49244 (public share zip download could read
    # files outside the share) and CVE-2026-49245 (stored XSS via shares)
    image: drakkan/sftpgo:v2.7.6
    restart: unless-stopped
    # host networking with the web UI bound to loopback: caddy is its only
    # client, so X-Forwarded-For from 127.0.0.1 is trustworthy as-is and the
    # brute-force defender bans the real client instead of caddy. A published
    # docker port would also bypass the host's INPUT policy onto the LAN
    network_mode: host
    environment:
      SFTPGO_HTTPD__BINDINGS__0__ADDRESS: "127.0.0.1"
      SFTPGO_HTTPD__BINDINGS__0__PROXY_ALLOWED: "127.0.0.1"
      SFTPGO_HTTPD__BINDINGS__0__CLIENT_IP_PROXY_HEADER: "X-Forwarded-For"
      # sftpgo's own SFTP server is on by default - ssh already serves SFTP,
      # and samba handles mounting. WebDAV/FTP are off by default already
      SFTPGO_SFTPD__BINDINGS__0__PORT: "0"
      SFTPGO_COMMON__DEFENDER__ENABLED: "true"
      # mode 1: create what's missing, never touch what exists - accounts are
      # managed in the web UI after their first creation
      SFTPGO_LOADDATA_FROM: "/provision/provision.json"
      SFTPGO_LOADDATA_MODE: "1"
    volumes:
      # sqlite db: accounts, share links - persistent runtime state
      - ./sftpgo_data:/var/lib/sftpgo
      - ./sftpgo_home:/srv/sftpgo
      - ./provision:/provision:ro
