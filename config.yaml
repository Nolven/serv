# uncomment to enable components
components:
        - frigate
        - pihole
        - beszel
        - landing
        - caddy
        - wg-easy
        - ddns
        - ssh
        - firewall

##################################################################
general:
        apex_domain: "noor.now"
        hostname: "noor"
        host_ip: 10.100.0.1         # since connection is possible only through wireguard; it's both hip and wg iface
        wan_host: "33.duckdns.org"  # public hostname WG clients connect to should be the same as in ddns.domain

        fileserver_root: /srv/share

        build_path: ./build
        install: /stacks/survur     # where everything non-shared will exist

        common_config_folder:       # folder with symlinks to each config (not compose)
                enable: true
                path: /stacks/cfg

##################################################################
# docker (henrygd/beszel). Hub + agent for this host: CPU/RAM/disk/network
# history, per-container stats, and alerts. The hub's port is published on
# 127.0.0.1 only - the reverse proxy reaches it there, and a published docker
# port would otherwise bypass the host's INPUT policy onto the LAN.
# beszel_data/ (hub, includes its own SQLite db + generated SSH key) and
# agent_data/ (fingerprint) are persistent runtime state - never regenerated.
beszel:
        subdomain:
                name: monitor
                port: 8090
                wan: false
        admin_email: "admin@noor.now"        # hub login - any address, no mail is sent to it
        admin_pass: "changeme-please"   # USER, BE RESPONSIBLE - CHANGE (min 10 chars)

        # One-time pairing. The hub generates its public key and registration
        # token on first run, so these cannot be known before it starts:
        # leave them empty for the first deploy (only the hub is rendered),
        # then follow the reminder printed at the end of that run.
        agent:
                key: ""
                token: ""
                # listen_port: 45876        # optional - agent's own loopback listener

##################################################################
# index page at the apex domain, linking every published subdomain
landing:
        title: "noor"
        wan: false

##################################################################
caddy:
        https: true
        wan_enable: false
        fileserver:
                enable: true
                subdomain: fs
                browsable: true
                wan: false

##################################################################
frigate:
        subdomain:
                name: "cams"
                port: 8971
                wan: false
        docker:
                shm_size: "187m"
                volumes:
                        - ./config:/config
                        - ./storage:/media/frigate
                ports:
                        - "8971:8971"
                        # - "5000:5000" # Internal unauthenticated access. Expose carefully.
                        # - "8554:8554" # RTSP feeds
                        - "8555:8555/tcp" # WebRTC over tcp
                        # - "8555:8555/udp" # WebRTC over udp

        # every cam is enabled; by default each cam has audio and record
        # roles in ffmpeg section. detect defaults false if omitted
        # onvif_port is optional - omit to skip onvif for that camera
        cams:
               name:
                       login: "asd"
                       password: "asd"
                       ip: 1.1.1.1
                       stream: "stream1"
                       detect: false
                       onvif_port: 8000

##################################################################
# will use my script with duckdns
# https://github.com/Nolven/duckdns_keepup
ddns:
        bin_path: /usr/local/bin
        domain: "33"
        token: "321d12ed12"

##################################################################
pihole:
        # for webui
        subdomain:
                port: 8081
                name: pihole
                redir: /admin
                wan: false
        admin_pass: 12345         # USER, BE RESPONSIBLE - CHANGE
        upstream_dns: 8.8.8.8

###################################################################
# docker (ghcr.io/wg-easy/wg-easy). WireGuard server + webui, network_mode:
# host so wg0 lands on the host itself (general.host_ip). INIT_* setup only
# runs on the container's very first start - after that, listen_port/
# admin_user/admin_pass/dns changes here have no effect until also changed
# by hand in the webui at wg.<apex_domain>.
wg-easy:
        # interface_ip = general.host_ip
        server_mask: 24
        listen_port: 44444
        admin_user: "admin"
        admin_pass: "changeme-please"   # USER, BE RESPONSIBLE - CHANGE
        subdomain:
                name: wg
                port: 51821
                wan: false
        # dns: "1.1.1.1"                # optional - default DNS pushed to WG clients

###################################################################
ssh:
        port: 1488          # lazy security from bots
        permit_root_login: "yes"
        password_authentication: true

###################################################################
firewall: # nftables
        nft_file_path: /stacks/cfg/nftables.conf