# uncomment to enable components
components:
        - frigate
        - pihole
        - caddy
        - wireguard
        - ddns          # must-have for static outside access

##################################################################
general:
        apex_domain: "noor.now"
        hostname: "noor"
        fileserver_root: /srv/share
        stack_root: /stacks/survur     # where everything non-shared will exist
        ssh:
                port: 1488 # lazy security from bots

##################################################################
caddy:
        fileserver:
                enable: true
                root: "/srv/"
                auto_https: true



##################################################################
frigate:
        docker:
                shm_size: "100m"
                volumes:
                        - ./config:/config
                        - ./storage:/media/frigate
                ports:
                        - "8971:8971"
                        # - "5000:5000" # Internal unauthenticated access. Expose carefully.
                        # - "8554:8554" # RTSP feeds
                        - "8555:8555/tcp" # WebRTC over tcp
                        # - "8555:8555/udp" # WebRTC over udp

        # by default each cam has audio and record roles in ffmpeg section
        cams:
               name:
                       login: ""
                       password: ""
                       ip: 1.1.1.1
                       stream: "stream1"
                       detect: false

